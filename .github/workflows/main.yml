name: Build and Deploy Node Service

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      # Step 1: Checkout your repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # Use a PAT with write:packages scope

      # Step 3: Build and push Docker image
      - name: Build and push Docker image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=ghcr.io/$REPO/node-service:latest
          echo "Using image name: $IMAGE_NAME"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      # Step 4: Deploy to remote server
      - name: Deploy to remote server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 192.168.1.13
          username: osboxes
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME=ghcr.io/$REPO/node-service:latest
            echo "Deploying image: $IMAGE_NAME"
            docker pull $IMAGE_NAME
            docker stop node-service || true
            docker rm node-service || true
            docker run -d --name node-service \
              --env-file /home/${{ secrets.SERVER_USER }}/.env \
              -p 3000:3000 \
              $IMAGE_NAME
